name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Update Submodules]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@darkfactory
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "52816adc67cf9327831ecba775e8c9fdde764051"
    secrets: inherit
