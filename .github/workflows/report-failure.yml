name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Update Submodules]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd372b6c921316b0ee69d2d0b50a2e584f18"
    secrets: inherit
