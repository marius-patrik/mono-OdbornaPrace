name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Update Submodules]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d"
    secrets: inherit
