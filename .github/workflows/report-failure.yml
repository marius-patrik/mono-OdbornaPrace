name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Update Submodules]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@6d42a0ea793a3e1fc26876ff99662a94f82bb987
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "6d42a0ea793a3e1fc26876ff99662a94f82bb987"
    secrets: inherit
